<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found &middot; Nicholas B. Anya</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/png" href="/assets/img/profile-photo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,450;9..144,550;9..144,600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/assets/css/styles.css" />
    <style>
      .not-found {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 2rem 1.5rem;
      }

      .not-found .code {
        font-family: var(--font-mono);
        font-size: 0.85rem;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--muted);
        margin-bottom: 1rem;
      }

      .not-found h1 {
        font-size: clamp(2.2rem, 5vw, 3.4rem);
        margin-bottom: 0.9rem;
      }

      .not-found p {
        color: var(--muted);
        max-width: 34rem;
        margin: 0 auto 1.8rem;
      }
    </style>
  </head>
  <body>
    <main class="not-found">
      <p class="code">Error 404</p>
      <h1>This page doesn't exist</h1>
      <p>
        The page you're looking for may have been moved or never existed. You can head back to
        the portfolio to explore my papers and projects.
      </p>
      <a class="btn-primary" href="/">Back to the portfolio</a>
    </main>
    <script
      data-goatcounter="https://nicholasanya.goatcounter.com/count"
      async
      src="https://gc.zgo.at/count.js"
    ></script>
  </body>
</html>
